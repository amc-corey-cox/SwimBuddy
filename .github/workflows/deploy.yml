name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Writes the built site to the gh-pages branch, which Pages serves.
permissions:
  contents: write

# Previews write to the same branch, so serialize every writer.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert no fixture data reached the production bundle
        run: npm run check:bundle

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/publish-to-gh-pages.sh \
            --source dist \
            --dest . \
            --message "Deploy ${GITHUB_SHA::7} to production"

      - name: Summary
        run: |
          echo "Deployed to https://amc-corey-cox.github.io/SwimBuddy/" >> "$GITHUB_STEP_SUMMARY"
